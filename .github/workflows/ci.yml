name: CI

# Criterio de diseño:
# 1. Gateamos sobre lo que de verdad valida el código hoy (typecheck + build + validate).
#    No inventamos un job de "tests" que no existen: se agrega cuando haya runner.
# 2. Install determinístico: npm ci contra package-lock.json (nada de npm install).
# 3. Un job por workspace para que una falla apunte directo al módulo que la causó.
# 4. Node 24 fijado a propósito: coincide con la imagen node:24 de docker-compose.
#    Si cambiás la imagen del compose, actualizá acá también.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — typecheck, build y lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/frontend

      # `tsc -b` ya hace typecheck completo de los dos proyectos
      # (tsconfig.app.json y tsconfig.node.json) antes de bundlear.
      - name: Build (typecheck + Vite)
        run: npm run build --workspace apps/frontend

  bff:
    name: BFF — prisma generate, typecheck y validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache motores de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-engines-${{ runner.os }}-${{ hashFiles('apps/bff/prisma/schema.prisma', 'apps/bff/package.json') }}

      - name: Instalar dependencias
        run: npm ci

      # El build del BFF corre `prisma generate` antes de `tsc`, por lo que
      # cubre la generación del cliente + typecheck de una sola vez.
      - name: Build (prisma generate + tsc)
        run: npm run build --workspace apps/bff

      # No conecta a la base: valida la sintaxis y coherencia del schema.
      - name: Validar schema de Prisma
        run: npm run prisma:validate --workspace apps/bff
