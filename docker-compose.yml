services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dacs
      POSTGRES_PASSWORD: dacs
      POSTGRES_DB: dacs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dacs -d dacs"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: dacs
      RABBITMQ_DEFAULT_PASS: dacs
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  bff:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8090:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://dacs:dacs@db:5432/dacs"
      RABBITMQ_URL: "amqp://dacs:dacs@broker:5672"
      JWT_SECRET: "${JWT_SECRET:-dev-only-jwt-secret-change-me}"
    command: sh -c "npm install --no-audit --no-fund && npm run dev --workspace @proyectodacs/bff"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  frontend:
    image: node:24
    working_dir: /app/apps/frontend
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8090/api"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - bff

volumes:
  pgdata:
  rabbitdata:
